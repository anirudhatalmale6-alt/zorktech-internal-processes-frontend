<div class="chart">
  <ul class="chart__legend">
    @for (item of series(); track item.key; let i = $index) {
      <li class="chart__legend-item">
        <span class="chart__swatch" [style.background]="colorFor(item, i)" aria-hidden="true"></span>
        {{ item.label }}
      </li>
    }
  </ul>

  <svg
    class="chart__svg"
    [attr.viewBox]="'0 0 ' + width + ' ' + height"
    role="img"
    [attr.aria-label]="'Grouped bar chart comparing ' + series().length + ' series across ' + categories().length + ' periods'"
  >
    <!-- Gridlines + y-axis labels -->
    @for (value of gridValues(); track value) {
      <line
        class="chart__grid"
        [attr.x1]="padding.left"
        [attr.x2]="width - padding.right"
        [attr.y1]="yFor(value)"
        [attr.y2]="yFor(value)"
      />
      <text
        class="chart__axis-label chart__axis-label--y"
        [attr.x]="padding.left - 8"
        [attr.y]="yFor(value) + 4"
        text-anchor="end"
      >
        {{ value }}
      </text>
    }

    <!-- Bars -->
    @for (bar of bars(); track bar.key) {
      <rect
        class="chart__bar"
        [attr.x]="bar.x"
        [attr.y]="bar.y"
        [attr.width]="bar.width"
        [attr.height]="bar.height"
        [attr.fill]="bar.color"
        rx="2"
      >
        <!-- Native SVG tooltip: no JS, and it works on keyboard focus too. -->
        <title>{{ bar.label }}</title>
      </rect>
    }

    <!-- Category labels -->
    @for (tick of categoryTicks(); track tick.label) {
      <text
        class="chart__axis-label"
        [attr.x]="tick.x"
        [attr.y]="height - 10"
        text-anchor="middle"
      >
        {{ tick.label }}
      </text>
    }
  </svg>
</div>
