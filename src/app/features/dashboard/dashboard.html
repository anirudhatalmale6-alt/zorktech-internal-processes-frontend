<zt-page-header
  eyebrow="Internal processes"
  title="Dashboard"
  description="Live view of process throughput and anything waiting on a decision."
>
  <button type="button" class="btn btn--secondary">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path
        fill="currentColor"
        d="M19 12v7H5v-7H3v7a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7h-2zm-6 .67 2.6-2.58L17 11.5l-5 5-5-5 1.4-1.41L11 12.67V3h2v9.67z"
      />
    </svg>
    Export
  </button>

  <button type="button" class="btn btn--primary">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path fill="currentColor" d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z" />
    </svg>
    New process
  </button>
</zt-page-header>

<!-- ── KPI row ──────────────────────────────────────────────────────────── -->
<section class="stats" aria-label="Key figures">
  @if (summary(); as data) {
    <zt-stat-tile
      label="Active processes"
      [value]="data.activeProcesses"
      [delta]="data.activeProcessesDelta"
    />
    <zt-stat-tile
      label="Completed this month"
      [value]="data.completedThisMonth"
      [delta]="data.completedThisMonthDelta"
    />
    <zt-stat-tile
      label="Average cycle time"
      [value]="data.averageCycleHours"
      format="1.1-1"
      suffix="h"
      [delta]="data.averageCycleHoursDelta"
      [higherIsBetter]="false"
    />
    <!--
      Overdue tasks: higherIsBetter=false, so the +15% renders red. With the
      default it would render green, cheerfully reporting a growing backlog as
      an improvement.
    -->
    <zt-stat-tile
      label="Overdue tasks"
      [value]="data.overdueTasks"
      [delta]="data.overdueTasksDelta"
      [higherIsBetter]="false"
    />
  } @else if (summaryLoading()) {
    @for (placeholder of [0, 1, 2, 3]; track placeholder) {
      <div class="stat-skeleton" aria-hidden="true"></div>
    }
  }
</section>

<!-- ── Chart ────────────────────────────────────────────────────────────── -->
<zt-card
  title="Throughput"
  subtitle="Processes started against processes completed, last 7 days"
  class="dashboard__chart"
>
  @if (chartLoading()) {
    <div class="chart-skeleton" aria-hidden="true"></div>
  } @else {
    <zt-bar-chart [categories]="chartCategories()" [series]="chartSeries()" />
  }
</zt-card>

<!-- ── Recent processes ─────────────────────────────────────────────────── -->
<zt-card title="Recently updated" subtitle="Click a row to open the process" [flush]="true">
  <a ztCardAction class="btn btn--ghost btn--sm" href="#">View all</a>

  <zt-data-table
    [columns]="columns"
    [rows]="processes()"
    [loading]="tableLoading()"
    [sort]="sort()"
    emptyTitle="No processes yet"
    emptyDescription="Processes will appear here as soon as the first one is started."
    (sortChange)="onSortChange($event)"
    (rowClick)="onRowClick($event)"
  >
    <ng-template ztCell="status" let-row>
      <zt-status-badge [label]="statusLabel(row)" [tone]="statusTone(row)" />
    </ng-template>

    <ng-template ztCell="progress" let-row>
      <div class="progress" [attr.title]="row.progress + '% complete'">
        <div
          class="progress__bar"
          role="progressbar"
          [attr.aria-valuenow]="row.progress"
          aria-valuemin="0"
          aria-valuemax="100"
          [attr.aria-label]="'Progress for ' + row.reference"
        >
          <span class="progress__fill" [style.width.%]="row.progress"></span>
        </div>
        <span class="progress__value u-numeric">{{ row.progress }}%</span>
      </div>
    </ng-template>

    <ng-template ztCell="updatedAt" let-row>
      <span class="u-numeric">{{ row.updatedAt | date: 'dd MMM, HH:mm' }}</span>
    </ng-template>
  </zt-data-table>
</zt-card>
