@if (blocked()) {
  <div class="gate" role="alertdialog" aria-labelledby="gate-title" aria-describedby="gate-body">
    <div class="gate__panel">
      <svg class="gate__icon" viewBox="0 0 24 24" aria-hidden="true">
        <path
          fill="currentColor"
          d="M17 1H7a2 2 0 0 0-2 2v18a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V3a2 2 0 0 0-2-2zm0 18H7V5h10v14z"
        />
        <path fill="currentColor" d="m3.3 2.3 18.4 18.4-1.4 1.4L1.9 3.7z" />
      </svg>

      <h1 class="gate__title" id="gate-title">This screen is too narrow</h1>

      <p class="gate__body" id="gate-body">
        The Zorktech internal system is built for desktop and tablet. Please open it on a
        larger screen, or widen this window.
      </p>

      <p class="gate__detail">
        Current width <strong class="u-numeric">{{ currentWidth() }}px</strong> &middot;
        minimum <strong class="u-numeric">{{ minWidth }}px</strong>
      </p>
    </div>
  </div>
}
